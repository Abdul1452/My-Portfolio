name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      # Let frontend and backend both finish even if one fails, so a single
      # run shows every problem. (The default cancels the other job, which
      # makes a passing workspace look failed.)
      fail-fast: false
      matrix:
        workspace: [frontend, backend]

    steps:
      - uses: actions/checkout@v5

      # No `version:` input on purpose: the action reads "packageManager"
      # from the root package.json, so CI runs the same pnpm as local
      # development and can read the lockfile it wrote.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # --frozen-lockfile: install exactly what pnpm-lock.yaml records, and
      # fail if package.json and the lockfile disagree, instead of quietly
      # resolving different versions than you have locally.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @prisma/client is an empty placeholder until `prisma generate` builds
      # it from backend/prisma/schema.prisma. Without this step tsc fails with
      # "Module '@prisma/client' has no exported member 'PrismaClient'".
      # (Install doesn't do it for us: Prisma's postinstall looks for the
      # schema at the repo root, but ours lives in backend/prisma/.)
      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        run: pnpm db:generate

      - name: Generate Prisma client
        if: matrix.workspace == 'backend'
        run: pnpm --filter backend db:generate

      - name: Lint ${{ matrix.workspace }}
        run: pnpm --filter ${{ matrix.workspace }} lint

      - name: Type-check ${{ matrix.workspace }}
        run: pnpm --filter ${{ matrix.workspace }} type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Backend build (tsc) needs the generated client too — see above.
      - name: Generate Prisma client
        run: pnpm db:generate
      - run: pnpm build
