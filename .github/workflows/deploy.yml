name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vercel/Netlify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend build
      # TODO: Add Vercel / Netlify deploy action here

  deploy-backend:
    name: Deploy Backend (Railway/Render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # TODO: Add Railway / Render deploy action here
      # (it will need `pnpm db:generate` before building, like ci.yml)
