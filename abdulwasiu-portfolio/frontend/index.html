<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta Tags ──────────────────────────────────────────────── -->
    <title>Abdulwasiu Abdullahi Olamilekan — Software Engineer & PM</title>
    <meta
      name="title"
      content="Abdulwasiu Abdullahi Olamilekan — Software Engineer & PM"
    />
    <meta
      name="description"
      content="Software Engineer and Project Management student in Turku, Finland. Full-stack development with React, TypeScript, and Node.js, plus Agile project delivery."
    />
    <meta name="author" content="Abdulwasiu Abdullahi Olamilekan" />

    <!-- ── Open Graph / Facebook / LinkedIn ───────────────────────────────────
         These tags control how the link looks when shared on social media
         (the preview card with image, title, and description). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abdulwasiu.dev" />
    <meta
      property="og:title"
      content="Abdulwasiu Abdullahi Olamilekan — Software Engineer & PM"
    />
    <meta
      property="og:description"
      content="Software Engineer and Project Management student in Turku, Finland."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- ── Twitter/X Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Abdulwasiu Abdullahi Olamilekan — Software Engineer & PM"
    />
    <meta
      name="twitter:description"
      content="Software Engineer and Project Management student in Turku, Finland."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ── Favicon & PWA manifest ─────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#33B587" />

    <!-- ── Fonts: preconnect speeds up the Google Fonts request ───────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Coastal redesign fonts (CoastalHomePage) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts the entire app into this div (see main.tsx). -->
    <div id="root"></div>

    <!-- Vite injects the bundled script here. type="module" enables ES modules. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
