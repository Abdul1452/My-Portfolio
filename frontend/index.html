<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary Meta Tags ──────────────────────────────────────────────── -->
    <title>Abdullahi Abdulwasiu — Software Engineering & Project Management</title>
    <meta
      name="title"
      content="Abdullahi Abdulwasiu — Software Engineering & Project Management"
    />
    <meta
      name="description"
      content="Software Engineering & Project Management student in Turku, Finland. Backend and full-stack development with Node.js, TypeScript, PostgreSQL and Docker. PRY Foundation (IPMA) certified."
    />
    <meta name="author" content="Abdullahi Olamilekan Abdulwasiu" />

    <!-- ── Open Graph / Facebook / LinkedIn ───────────────────────────────────
         These tags control how the link looks when shared on social media
         (the preview card with image, title, and description). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abdulwasiu.dev" />
    <meta
      property="og:title"
      content="Abdullahi Abdulwasiu — Software Engineering & Project Management"
    />
    <meta
      property="og:description"
      content="Software Engineer and Project Management student in Turku, Finland."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- ── Twitter/X Card ─────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Abdullahi Abdulwasiu — Software Engineering & Project Management"
    />
    <meta
      name="twitter:description"
      content="Software Engineer and Project Management student in Turku, Finland."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ── Favicon & PWA manifest ─────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#11110f" />

    <!-- ── Fonts: preconnect speeds up the Google Fonts request ───────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Portfolio v5 fonts (PortfolioV5Page): Onest for text, JetBrains Mono for code -->
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts the entire app into this div (see main.tsx). -->
    <div id="root"></div>

    <!-- Vite injects the bundled script here. type="module" enables ES modules. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
